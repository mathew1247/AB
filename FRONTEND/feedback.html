<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Performance Evaluation Report</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-page);">
    <div style="background: var(--bg-card); padding: 3rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-main); max-width: 550px; width: 90%; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">📊 ✨</div>
        <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--text-dark); margin-bottom: 0.5rem;">AI Performance Evaluation</h2>
        <div style="display: flex; justify-content: center; gap: 1rem; margin: 1.2rem 0;">
            <div style="background: var(--accent-green-light); padding: 0.8rem 1.2rem; border-radius: var(--radius-md);">
                <div style="font-size: 1.5rem; font-weight: 800; color: var(--accent-green);">86%</div>
                <div style="font-size: 0.75rem; color: var(--text-body);">Technical Knowledge</div>
            </div>
            <div style="background: var(--accent-purple-light); padding: 0.8rem 1.2rem; border-radius: var(--radius-md);">
                <div style="font-size: 1.5rem; font-weight: 800; color: var(--accent-purple);">82%</div>
                <div style="font-size: 0.75rem; color: var(--text-body);">Communication</div>
            </div>
        </div>
        <p style="color: var(--text-body); font-size: 0.9rem; margin-bottom: 1.8rem; line-height: 1.6; text-align: left;">
            <strong>Strengths:</strong> Clear explanation of class hierarchies and method definitions.<br>
            <strong>Room for Improvement:</strong> Deepen understanding of multiple inheritance order (MRO) and super() calls.
        </p>
        <div style="display: flex; flex-direction: column; gap: 0.8rem;">
            <a href="dashboard.html" class="btn-pill btn-pill-dark" style="text-decoration: none; justify-content: center; width: 100%;">← Return to Dashboard</a>
        </div>
    </div>
</body>
</html>
