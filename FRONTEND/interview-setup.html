<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Technical Interview Setup</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-page);">
    <div style="background: var(--bg-card); padding: 3rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-main); max-width: 500px; width: 90%; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">🤖</div>
        <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--text-dark); margin-bottom: 0.5rem;">Start New AI Interview</h2>
        <p style="color: var(--text-body); font-size: 0.95rem; margin-bottom: 1.8rem; line-height: 1.6;">
            Select your domain (Python, Frontend, SQL, DSA), difficulty level, and role experience to initiate your adaptive AI interview session.
        </p>
        <div style="display: flex; flex-direction: column; gap: 0.8rem;">
            <a href="interview.html" class="btn-pill btn-pill-dark" style="text-decoration: none; justify-content: center; width: 100%;">Begin Live AI Interview →</a>
            <a href="dashboard.html" class="btn-pill btn-pill-light" style="text-decoration: none; justify-content: center; width: 100%;">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
