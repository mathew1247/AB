<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Technical Interview | Be.run</title>
    <meta name="description" content="Premium AI-driven technical interviews.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

            /* Premium Light Coffee / Warm Cream Palette */
            --bg-primary: #F7F2EA;
            --bg-secondary: #F2EADF;
            --card-main: #E7D9C7;
            --card-secondary: #EFE5D7;
            
            --text-primary: #211C18;
            --text-secondary: #75685B;
            --text-muted: #A39687;
            
            --coffee-primary: #8B6F52;
            --coffee-dark: #5F4937;
            --caramel-accent: #C49A6C;
            --caramel-light: #D9B892;
            
            --border-color: #D8C8B5;
            --white: #FFFFFF;
            
            --success: #7FA776;
            --warning: #D9A05B;
            --error: #C97A7E;
            
            --ai-glow: rgba(196, 154, 108, 0.35);
            --shadow-soft: 0 10px 30px rgba(95, 73, 55, 0.08);
            --shadow-sm: 0 4px 12px rgba(95, 73, 55, 0.05);
            
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --radius-pill: 9999px;
            
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Top Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            background: rgba(247, 242, 234, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .brand-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--coffee-dark);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .header-divider {
            width: 1px;
            height: 24px;
            background-color: var(--border-color);
        }

        .header-context {
            display: flex;
            flex-direction: column;
        }

        .hc-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--coffee-dark);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .hc-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .header-meta-item {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .timer-pill {
            background: var(--white);
            border: 1px solid var(--border-color);
            padding: 0.4rem 1rem;
            border-radius: var(--radius-pill);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: var(--coffee-dark);
            box-shadow: var(--shadow-sm);
        }

        .timer-warning {
            color: var(--error);
            border-color: var(--error);
            background: rgba(201, 122, 126, 0.1);
        }

        .btn-end {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-end:hover {
            color: var(--error);
        }

        /* Progress Bar Section */
        .progress-container {
            display: none; /* Shown dynamically */
            flex-direction: column;
            align-items: center;
            padding: 2rem 0;
            background: var(--bg-primary);
        }

        .progress-dots {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .p-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--card-secondary);
            transition: var(--transition);
        }

        .p-dot.completed {
            background: var(--coffee-primary);
            color: var(--white);
        }

        .p-dot.current {
            background: var(--white);
            color: var(--coffee-dark);
            border: 2px solid var(--caramel-accent);
            box-shadow: 0 0 15px var(--ai-glow);
            transform: scale(1.1);
        }

        .progress-text {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Main Workspace Area */
        .main-workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 2rem;
            padding-bottom: 5rem;
        }

        .content-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Generic Cards */
        .premium-card {
            background: var(--card-main);
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: relative;
        }
        
        .white-card {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-sm);
        }

        /* AI Identity / Status */
        .ai-identity-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .ai-icon-orb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--caramel-light), var(--coffee-primary));
            box-shadow: 0 0 12px var(--ai-glow);
        }

        .ai-icon-orb.pulsing {
            animation: pulse-orb 2s infinite ease-in-out;
        }

        @keyframes pulse-orb {
            0% { transform: scale(0.95); box-shadow: 0 0 10px var(--ai-glow); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px var(--ai-glow); }
            100% { transform: scale(0.95); box-shadow: 0 0 10px var(--ai-glow); }
        }

        .ai-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--coffee-dark);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .ai-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        
        .ai-status::before {
            content: '●';
            color: var(--success);
            font-size: 1rem;
        }
        
        .ai-status.thinking::before {
            content: '✦';
            color: var(--caramel-accent);
            animation: spin-slow 3s infinite linear;
        }

        @keyframes spin-slow {
            100% { transform: rotate(360deg); }
        }

        /* Question Typography */
        .q-meta-row {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--coffee-primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .q-text {
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
            letter-spacing: -0.02em;
        }

        /* Answer Section */
        .answer-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--coffee-dark);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: -0.5rem;
        }

        .answer-textarea {
            width: 100%;
            min-height: 240px;
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            font-family: var(--font-primary);
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-primary);
            resize: vertical;
            outline: none;
            transition: var(--transition);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .answer-textarea::placeholder {
            color: var(--text-muted);
        }

        .answer-textarea:focus {
            border-color: var(--caramel-accent);
            box-shadow: 0 0 0 4px rgba(196, 154, 108, 0.15), inset 0 2px 4px rgba(0,0,0,0.02);
        }
        
        .answer-textarea:disabled {
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .answer-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .char-count {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Buttons */
        .btn {
            padding: 0.85rem 1.8rem;
            border-radius: var(--radius-pill);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
            outline: none;
        }

        .btn-primary {
            background: var(--text-primary);
            color: var(--white);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            background: var(--coffee-dark);
            box-shadow: var(--shadow-soft);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--white);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-primary);
            border-color: var(--coffee-primary);
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }
        
        .controls-left {
            display: flex;
            gap: 1rem;
        }

        /* Evaluation UI */
        .eval-loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
            gap: 1.5rem;
        }
        
        .eval-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--coffee-dark);
        }
        
        .eval-steps {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            text-align: left;
            margin-top: 1rem;
        }
        
        .eval-step {
            font-size: 0.95rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .eval-step.done::before {
            content: '✓';
            color: var(--success);
            font-weight: bold;
        }
        .eval-step.active::before {
            content: '●';
            color: var(--caramel-accent);
        }
        .eval-step.pending::before {
            content: '○';
            color: var(--border-color);
        }

        /* Final Report */
        .report-header {
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .report-score {
            font-size: 4rem;
            font-weight: 700;
            color: var(--coffee-dark);
            line-height: 1;
        }
        
        .report-score-label {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .report-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        
        .report-metrics {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .metric-lbl {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .metric-val {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--coffee-primary);
        }

        .feedback-box {
            background: var(--bg-primary);
            padding: 1.5rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .feedback-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        
        .feedback-lists {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .f-list-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--coffee-dark);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }
        
        .f-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        
        .f-item {
            font-size: 0.9rem;
            color: var(--text-secondary);
            padding-left: 1.2rem;
            position: relative;
        }
        
        .f-item.strength::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--success);
            font-weight: bold;
        }
        
        .f-item.weakness::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--warning);
            font-weight: bold;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(247, 242, 234, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal-card {
            background: var(--white);
            padding: 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid var(--border-color);
            transform: translateY(20px);
            transition: var(--transition);
        }
        
        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--coffee-dark);
            margin-bottom: 0.5rem;
        }
        
        .modal-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }
        
        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-header {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
            .header-right {
                width: 100%;
                justify-content: space-between;
            }
            .main-workspace {
                padding: 1rem;
            }
            .premium-card {
                padding: 1.5rem;
            }
            .q-text {
                font-size: 1.5rem;
            }
            .controls-row {
                flex-direction: column-reverse;
                gap: 1rem;
            }
            .controls-left, .btn-primary {
                width: 100%;
                justify-content: center;
            }
            .report-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <a href="dashboard.html" class="brand-logo">Be.run</a>
            <div class="header-divider" id="header-div-1" style="display: none;"></div>
            <div class="header-context" id="header-context" style="display: none;">
                <span class="hc-title">AI Technical Interview</span>
                <span class="hc-subtitle" id="header-role">Backend Developer</span>
            </div>
        </div>
        <div class="header-right" id="header-right-meta" style="display: none;">
            <span class="header-meta-item" id="header-question-count">Question 01 / 10</span>
            <span class="timer-pill" id="header-timer">20:00</span>
            <button class="btn-end" onclick="showEndModal()">End Interview</button>
        </div>
    </header>

    <!-- Progress Tracker -->
    <div class="progress-container" id="progress-container">
        <div class="progress-dots" id="progress-dots">
            <!-- Dynamically injected -->
        </div>
        <div class="progress-text" id="progress-text">0% Complete</div>
    </div>

    <!-- Main Workspace -->
    <main class="main-workspace">
        <div class="content-container" id="workspace-viewport">
            <!-- Dynamic States Rendered Here -->
        </div>
    </main>

    <!-- End Interview Modal -->
    <div class="modal-overlay" id="end-modal">
        <div class="modal-card">
            <h3 class="modal-title">End Interview?</h3>
            <p class="modal-text">Your current progress will be saved, but unanswered questions will remain incomplete.</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="hideEndModal()">Continue Interview</button>
                <button class="btn btn-primary" style="background: var(--error);" onclick="confirmEndInterview()">End Interview</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const API_BASE = 'http://localhost:5000/api'; // Mock/Fallback logic implemented
        
        let currentState = {
            candidate: { name: "Candidate", role: "Backend Developer" },
            curriculum: "Spring Boot",
            totalQuestions: 5,
            questionNumber: 1,
            status: "ACTIVE", // ACTIVE, EVALUATING, COMPLETED
            currentQuestion: null,
            timerSeconds: 1200,
            timerInterval: null
        };

        // Fallback mock data
        const mockQuestions = [
            { id: 'q1', topic: 'Spring Core', difficulty: 'Medium', category: 'Technical', text: 'Explain how dependency injection works internally in Spring Framework and how Spring manages the lifecycle of beans.' },
            { id: 'q2', topic: 'REST APIs', difficulty: 'Medium', category: 'Technical', text: 'How would you design a scalable REST API for millions of users? Mention your approach to caching and rate limiting.' },
            { id: 'q3', topic: 'Database', difficulty: 'Advanced', category: 'Technical', text: 'Explain database indexing and when you would use a composite index versus single-column indexes.' },
            { id: 'q4', topic: 'Architecture', difficulty: 'Advanced', category: 'System Design', text: 'Describe the differences between monolithic and microservice architectures. When would you strictly avoid microservices?' },
            { id: 'q5', topic: 'Problem Solving', difficulty: 'Medium', category: 'Behavioral', text: 'Tell me about a time you had to optimize a slow-performing backend endpoint. What was your systematic approach?' }
        ];

        const mockFinalReport = {
            score: 84,
            techScore: 88,
            probScore: 82,
            commScore: 76,
            summary: "You demonstrated strong backend fundamentals and good Spring knowledge. Your explanations were technically accurate, but some answers could be more structured.",
            strengths: ["Strong Spring Boot knowledge", "Good API understanding", "Strong technical reasoning"],
            weaknesses: ["System design depth", "Explanation structure", "Database optimization detailed tuning"]
        };

        // --- Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            startInterviewDirectly();
        });

        // --- UI Rendering Functions ---

        function updateHeaderAndProgress() {
            const hDivider = document.getElementById('header-div-1');
            const hContext = document.getElementById('header-context');
            const hRight = document.getElementById('header-right-meta');
            const pContainer = document.getElementById('progress-container');
            
            if (currentState.status === 'COMPLETED') {
                hDivider.style.display = 'none';
                hContext.style.display = 'none';
                hRight.style.display = 'none';
                pContainer.style.display = 'none';
            } else {
                hDivider.style.display = 'block';
                hContext.style.display = 'flex';
                hRight.style.display = 'flex';
                pContainer.style.display = 'flex';
                
                document.getElementById('header-role').innerText = currentState.candidate.role;
                
                const qNumStr = String(currentState.questionNumber).padStart(2, '0');
                const tNumStr = String(currentState.totalQuestions).padStart(2, '0');
                document.getElementById('header-question-count').innerText = `Question ${qNumStr} / ${tNumStr}`;
                
                // Progress dots
                const pDots = document.getElementById('progress-dots');
                let dotsHtml = '';
                for (let i = 1; i <= currentState.totalQuestions; i++) {
                    let cls = '';
                    if (i < currentState.questionNumber) cls = 'completed';
                    else if (i === currentState.questionNumber) cls = 'current';
                    
                    dotsHtml += `<div class="p-dot ${cls}">${String(i).padStart(2, '0')}</div>`;
                }
                pDots.innerHTML = dotsHtml;
                
                const pct = Math.round(((currentState.questionNumber - 1) / currentState.totalQuestions) * 100);
                document.getElementById('progress-text').innerText = `${pct}% Complete`;
            }
        }

        function startInterviewDirectly() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role') || "Backend Developer";
            
            currentState.candidate.role = role;
            currentState.totalQuestions = 5;
            currentState.questionNumber = 1;
            currentState.status = 'ACTIVE';
            currentState.timerSeconds = 1200;
            currentState.currentQuestion = mockQuestions[0];
            
            startTimer();
            renderQuestionScreen();
        }

        function renderQuestionScreen() {
            currentState.status = 'ACTIVE';
            updateHeaderAndProgress();

            const viewport = document.getElementById('workspace-viewport');
            const q = currentState.currentQuestion;
            const qNumStr = String(currentState.questionNumber).padStart(2, '0');
            
            // Fade-in animation effect
            viewport.style.opacity = 0;
            viewport.style.transform = 'translateY(10px)';

            viewport.innerHTML = `
                <div class="premium-card">
                    <div class="ai-identity-row">
                        <div class="ai-icon-orb pulsing"></div>
                        <div style="display: flex; flex-direction: column;">
                            <span class="ai-label">✦ AI INTERVIEWER</span>
                            <span class="ai-status">Ready</span>
                        </div>
                    </div>
                    
                    <div class="q-meta-row">
                        <span>QUESTION ${qNumStr}</span>
                        <span>•</span>
                        <span>${q.topic}</span>
                        <span>•</span>
                        <span>${q.difficulty}</span>
                    </div>
                    
                    <h2 class="q-text">${q.text}</h2>
                </div>

                <div class="answer-label">YOUR ANSWER</div>
                <textarea class="answer-textarea" id="answer-input" placeholder="Type your answer here..." oninput="updateCharCount(this)"></textarea>
                
                <div class="answer-footer">
                    <span class="char-count" id="char-count-text">0 / 2500 characters</span>
                </div>

                <div class="controls-row">
                    <div class="controls-left">
                        <button class="btn btn-secondary" onclick="skipQuestion()" ${currentState.questionNumber === currentState.totalQuestions ? 'disabled' : ''}>Skip Question</button>
                    </div>
                    <button class="btn btn-primary" id="btn-submit" onclick="submitAnswer()">Submit Answer →</button>
                </div>
            `;

            setTimeout(() => {
                viewport.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
                viewport.style.opacity = 1;
                viewport.style.transform = 'translateY(0)';
                document.getElementById('answer-input').focus();
            }, 50);
            
            // Keyboard shortcut
            setTimeout(() => {
                const ta = document.getElementById('answer-input');
                if(ta) {
                    ta.addEventListener('keydown', (e) => {
                        if((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                            e.preventDefault();
                            submitAnswer();
                        }
                    });
                }
            }, 100);
        }

        function updateCharCount(el) {
            document.getElementById('char-count-text').innerText = `${el.value.length} / 2500 characters`;
        }

        function submitAnswer() {
            const ta = document.getElementById('answer-input');
            const btn = document.getElementById('btn-submit');
            
            if (ta.value.trim().length < 10) {
                alert("Please provide a more detailed answer before submitting.");
                return;
            }

            ta.disabled = true;
            btn.disabled = true;
            btn.innerText = "Analyzing Answer...";
            
            // Show evaluation state
            setTimeout(() => {
                renderEvaluationState();
            }, 600);
        }

        function skipQuestion() {
            if(confirm("Are you sure you want to skip this question? It will negatively impact your score.")) {
                proceedToNextQuestion();
            }
        }

        function renderEvaluationState() {
            const viewport = document.getElementById('workspace-viewport');
            
            viewport.innerHTML = `
                <div class="white-card eval-loading-box">
                    <div class="ai-icon-orb pulsing" style="width: 48px; height: 48px;"></div>
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                        <span class="ai-label">✦ AI INTERVIEWER</span>
                        <h2 class="eval-title">Analyzing your response...</h2>
                    </div>
                    
                    <div class="eval-steps">
                        <div class="eval-step done" id="step-1">Understanding technical content</div>
                        <div class="eval-step active" id="step-2">Checking relevance and accuracy</div>
                        <div class="eval-step pending" id="step-3">Evaluating depth and clarity</div>
                    </div>
                </div>
            `;

            // Mock progression
            setTimeout(() => {
                document.getElementById('step-2').className = 'eval-step done';
                document.getElementById('step-3').className = 'eval-step active';
            }, 1500);

            setTimeout(() => {
                proceedToNextQuestion();
            }, 3000);
        }

        function proceedToNextQuestion() {
            if (currentState.questionNumber >= currentState.totalQuestions) {
                renderFinalReport();
            } else {
                currentState.questionNumber++;
                // Mock fetching next adaptive question
                currentState.currentQuestion = mockQuestions[currentState.questionNumber - 1] || mockQuestions[0];
                renderQuestionScreen();
            }
        }

        function renderFinalReport() {
            stopTimer();
            currentState.status = 'COMPLETED';
            updateHeaderAndProgress();

            const viewport = document.getElementById('workspace-viewport');
            viewport.innerHTML = `
                <div class="premium-card">
                    <div class="report-header">
                        <h2 class="hc-title" style="margin-bottom: 1rem;">INTERVIEW COMPLETED</h2>
                        <div class="report-score">${mockFinalReport.score}</div>
                        <div class="report-score-label">Overall Score / 100</div>
                    </div>
                    
                    <div class="report-grid">
                        <div class="white-card">
                            <h3 class="f-list-title">Performance</h3>
                            <div class="report-metrics">
                                <div class="metric-row">
                                    <span class="metric-lbl">Technical Knowledge</span>
                                    <span class="metric-val">${mockFinalReport.techScore}%</span>
                                </div>
                                <div class="metric-row">
                                    <span class="metric-lbl">Problem Solving</span>
                                    <span class="metric-val">${mockFinalReport.probScore}%</span>
                                </div>
                                <div class="metric-row">
                                    <span class="metric-lbl">Communication</span>
                                    <span class="metric-val">${mockFinalReport.commScore}%</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="feedback-box">
                            <h3 class="f-list-title">AI Summary</h3>
                            <p class="feedback-text">${mockFinalReport.summary}</p>
                            
                            <div class="feedback-lists">
                                <div>
                                    <div class="f-list-title">Strengths</div>
                                    <ul class="f-list">
                                        ${mockFinalReport.strengths.map(s => `<li class="f-item strength">${s}</li>`).join('')}
                                    </ul>
                                </div>
                                <div>
                                    <div class="f-list-title">Areas to Improve</div>
                                    <ul class="f-list">
                                        ${mockFinalReport.weaknesses.map(w => `<li class="f-item weakness">${w}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div style="display: flex; justify-content: center; gap: 1rem; margin-top: 1rem;">
                        <a href="dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
                        <button class="btn btn-primary" onclick="startInterviewDirectly()">Retry Interview</button>
                    </div>
                </div>
            `;
        }

        // --- Modals and Timers ---
        function showEndModal() {
            document.getElementById('end-modal').classList.add('active');
        }

        function hideEndModal() {
            document.getElementById('end-modal').classList.remove('active');
        }

        function confirmEndInterview() {
            hideEndModal();
            renderFinalReport();
        }

        function startTimer() {
            stopTimer();
            updateTimerDisplay();
            currentState.timerInterval = setInterval(() => {
                currentState.timerSeconds--;
                updateTimerDisplay();
                
                if (currentState.timerSeconds <= 0) {
                    stopTimer();
                    alert("Time is up! Submitting active interview session details...");
                    renderFinalReport();
                }
            }, 1000);
        }

        function stopTimer() {
            if (currentState.timerInterval) {
                clearInterval(currentState.timerInterval);
                currentState.timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const m = Math.floor(currentState.timerSeconds / 60);
            const s = currentState.timerSeconds % 60;
            const el = document.getElementById('header-timer');
            if(el) {
                el.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                if (currentState.timerSeconds < 300) { // under 5 mins
                    el.classList.add('timer-warning');
                } else {
                    el.classList.remove('timer-warning');
                }
            }
        }
    </script>
</body>
</html>
