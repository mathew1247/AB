<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — InterviewAI</title>
    <meta name="description" content="Sign in or create your InterviewAI account to start AI-powered technical interview practice.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue: #2563EB;
            --blue-dark: #1D4ED8;
            --purple: #7C3AED;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --radius: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 40%, #0F172A 100%);
            position: relative;
            overflow: hidden;
        }

        /* Animated background orbs */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            animation: floatOrb 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: floatOrb 10s ease-in-out infinite alternate-reverse;
            pointer-events: none;
        }

        @keyframes floatOrb {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(40px, 30px) scale(1.05); }
        }

        /* Grid noise texture overlay */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }

        /* Back link */
        .back-link {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color var(--transition);
            z-index: 10;
        }
        .back-link:hover { color: #fff; }

        /* Card */
        .auth-card {
            position: relative;
            width: 100%;
            max-width: 440px;
            margin: 1rem;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 0 0 1px rgba(37, 99, 235, 0.2),
                0 0 40px rgba(37, 99, 235, 0.15),
                0 25px 50px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            z-index: 1;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Glowing top border accent */
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--blue), #818CF8, var(--blue), transparent);
            border-radius: 50%;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; box-shadow: 0 0 12px rgba(37, 99, 235, 0.5); }
            50%       { opacity: 1;   box-shadow: 0 0 24px rgba(37, 99, 235, 0.9); }
        }

        /* Logo */
        .auth-logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            text-decoration: none;
        }
        .auth-logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 0 16px rgba(37, 99, 235, 0.5);
        }
        .auth-logo-text {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.02em;
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .auth-tab-btn {
            flex: 1;
            padding: 0.65rem 1rem;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all var(--transition);
        }
        .auth-tab-btn.active {
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: #fff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        /* Form groups */
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(255,255,255,0.65);
            margin-bottom: 0.45rem;
            letter-spacing: 0.02em;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all var(--transition);
        }
        .form-input::placeholder { color: rgba(255,255,255,0.25); }
        .form-input:focus {
            border-color: var(--blue);
            background: rgba(37, 99, 235, 0.08);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        /* Submit button */
        .btn-submit {
            width: 100%;
            padding: 0.85rem 1rem;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
            transition: all var(--transition);
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
        }
        .btn-submit::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity var(--transition);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.55);
        }
        .btn-submit:hover::after { opacity: 1; }
        .btn-submit:active { transform: translateY(0); }

        /* Alert */
        .auth-alert {
            display: none;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 1.2rem;
            animation: slideDown 0.3s ease both;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .auth-alert.success {
            background: rgba(5, 150, 105, 0.15);
            border: 1px solid rgba(5, 150, 105, 0.4);
            color: #34D399;
        }
        .auth-alert.error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #FCA5A5;
        }

        /* Divider */
        .divider {
            text-align: center;
            position: relative;
            margin: 1.5rem 0 0;
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }
        .divider::before { left: 0; }
        .divider::after  { right: 0; }
    </style>
</head>

<body>
    <div class="bg-grid"></div>

    <a href="INDEX.HTML" class="back-link">
        ← Back to Home
    </a>

    <div class="auth-card">
        <a href="INDEX.HTML" class="auth-logo">
            <div class="auth-logo-icon">🤖</div>
            <span class="auth-logo-text">InterviewAI</span>
        </a>

        <div class="auth-tabs">
            <button class="auth-tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
            <button class="auth-tab-btn" id="tab-register" onclick="switchTab('register')">Create Account</button>
        </div>

        <div id="auth-alert" class="auth-alert"></div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleSubmit(event, 'login')">
            <div class="form-group">
                <label class="form-label" for="login-id">Username or Email</label>
                <input type="text" id="login-id" class="form-input" placeholder="e.g. amanda" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="login-password">Password</label>
                <input type="password" id="login-password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-submit" id="login-submit-btn">Sign In</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" onsubmit="handleSubmit(event, 'register')" style="display:none;">
            <div class="form-group">
                <label class="form-label" for="reg-username">Username</label>
                <input type="text" id="reg-username" class="form-input" placeholder="e.g. amanda" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="reg-email">Email Address</label>
                <input type="email" id="reg-email" class="form-input" placeholder="e.g. amanda@example.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="reg-password">Password</label>
                <input type="password" id="reg-password" class="form-input" placeholder="••••••••" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn-submit" id="register-submit-btn">Create Account</button>
        </form>

        <div class="divider">secure authentication</div>
    </div>

    <script>
        const API = 'http://localhost:5000/api';

        function switchTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('tab-login').classList.toggle('active', isLogin);
            document.getElementById('tab-register').classList.toggle('active', !isLogin);
            document.getElementById('login-form').style.display = isLogin ? 'block' : 'none';
            document.getElementById('register-form').style.display = isLogin ? 'none' : 'block';
            hideAlert();
        }

        function showAlert(msg, type) {
            const el = document.getElementById('auth-alert');
            el.textContent = msg;
            el.className = 'auth-alert ' + type;
            el.style.display = 'block';
        }

        function hideAlert() {
            const el = document.getElementById('auth-alert');
            el.style.display = 'none';
        }

        async function handleSubmit(e, action) {
            e.preventDefault();
            hideAlert();

            const btn = document.getElementById(action === 'login' ? 'login-submit-btn' : 'register-submit-btn');
            btn.disabled = true;
            btn.textContent = action === 'login' ? 'Signing in...' : 'Creating account...';

            let payload, endpoint;
            if (action === 'login') {
                payload = {
                    emailOrUsername: document.getElementById('login-id').value.trim(),
                    password: document.getElementById('login-password').value
                };
                endpoint = `${API}/login`;
            } else {
                payload = {
                    username: document.getElementById('reg-username').value.trim(),
                    email: document.getElementById('reg-email').value.trim(),
                    password: document.getElementById('reg-password').value
                };
                endpoint = `${API}/register`;
            }

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    showAlert(action === 'login' ? '✅ Login successful! Redirecting...' : '✅ Account created! Redirecting...', 'success');
                    localStorage.setItem('user', JSON.stringify(data.data));
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
                } else {
                    showAlert(data.error || 'Something went wrong. Try again.', 'error');
                    btn.disabled = false;
                    btn.textContent = action === 'login' ? 'Sign In' : 'Create Account';
                }
            } catch (err) {
                showAlert('❌ Cannot reach server. Make sure the backend is running on port 5000.', 'error');
                btn.disabled = false;
                btn.textContent = action === 'login' ? 'Sign In' : 'Create Account';
            }
        }
    </script>
</body>

</html>
