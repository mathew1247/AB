<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Technical Interview | Be.run</title>
    <meta name="description" content="Premium AI-driven technical interviews.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

            /* Coffee Inspired Color Palette */
            --espresso: #2B2118;
            --deep-coffee: #3A2A20;
            --dark-mocha: #4A3428;
            --coffee: #6F4E37;
            --mocha: #8B6B55;
            --taupe: #A88F7A;

            --cream: #FAF7F2;
            --ivory: #F5F0E8;
            --latte: #EDE3D7;

            --caramel: #C28A55;
            --soft-gold: #D4A574;

            --text-primary: #2B2118;
            --text-secondary: #5F5046;
            --text-muted: #8F8176;

            --border: #E3D8CC;

            /* Mapped Variables */
            --bg-canvas: var(--ivory);
            --text-main: var(--text-primary);
            --text-sub: var(--text-secondary);
            --border-light: var(--border);
            --pill-bg: var(--latte);
            --black-pill: var(--espresso);
            --white: #FFFFFF;
            
            --shadow-float: 0 10px 30px rgba(43, 33, 24, 0.05), 0 2px 8px rgba(43, 33, 24, 0.04);
            --shadow-subtle: 0 8px 30px rgba(43, 33, 24, 0.04);
            
            --radius-pill: 999px;
            --radius-box: 24px;
            --radius-inner: 16px;
            
            --transition-default: 180ms ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-canvas);
            background-image: radial-gradient(circle at top, var(--cream) 0%, var(--ivory) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 4rem;
        }

        /* Ambient Pastel Soft Gradient Glows */
        .ambient-glow-bottom-left {
            position: fixed;
            bottom: -160px;
            left: -160px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(194, 138, 85, 0.08) 0%, rgba(237, 227, 215, 0.02) 50%, transparent 70%);
            filter: blur(65px);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 8s infinite ease-in-out alternate;
        }

        .ambient-glow-bottom-right {
            position: fixed;
            bottom: -160px;
            right: -160px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(212, 165, 116, 0.08) 0%, rgba(245, 240, 232, 0.02) 50%, transparent 70%);
            filter: blur(65px);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 10s infinite ease-in-out alternate;
        }

        .ambient-glow-top {
            position: fixed;
            top: -220px;
            left: 50%;
            width: 750px;
            height: 450px;
            background: radial-gradient(circle, rgba(143, 107, 85, 0.06) 0%, rgba(250, 247, 242, 0.02) 60%, transparent 80%);
            filter: blur(75px);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlowTop 12s infinite ease-in-out alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.7; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        @keyframes pulseGlowTop {
            0% { opacity: 0.7; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        /* Top Header Navigation Bar */
        .dia-header {
            width: 100%;
            max-width: min(92vw, 1060px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 1.5rem 1rem 1.5rem;
            position: relative;
            z-index: 10;
            margin: 0 auto;
        }

        .dia-widget-btn {
            background: var(--espresso);
            border: 1px solid var(--deep-coffee);
            padding: 0.5rem 1.2rem;
            border-radius: var(--radius-pill);
            font-family: var(--font-sans);
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--cream);
            cursor: pointer;
            transition: all var(--transition-default);
            box-shadow: var(--shadow-subtle);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .dia-widget-btn:hover {
            background: var(--coffee);
            color: var(--white);
            border-color: var(--caramel);
            box-shadow: 0 4px 12px rgba(194, 138, 85, 0.25);
            transform: translateY(-1px);
        }

        /* Main Workspace Container */
        .dia-main {
            width: 100%;
            max-width: min(92vw, 1060px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 1.5rem;
            position: relative;
            z-index: 10;
        }

        /* Hero Title */
        .dia-hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--espresso);
            text-align: center;
            margin-bottom: 0.4rem;
            line-height: 1.2;
        }

        /* Background Window Wireframe Card (Question Panel) */
        .dia-window-mockup {
            width: 100%;
            background: rgba(250, 249, 246, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(227, 216, 204, 0.6);
            border-top: 4px solid var(--caramel);
            border-radius: var(--radius-box);
            box-shadow: var(--shadow-float);
            padding: 2rem;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            transition: all var(--transition-default);
        }

        .dia-window-dots {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.2rem;
        }

        .dia-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
        }

        .q-meta-row {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--taupe);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .q-meta-row span {
            display: inline-flex;
            align-items: center;
        }

        .q-meta-row span:last-child {
            background: var(--latte);
            color: var(--coffee);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-pill);
            font-size: 0.7rem;
            border: 1px solid var(--border);
            font-weight: 700;
        }

        .q-text {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--espresso);
            line-height: 1.4;
            letter-spacing: -0.01em;
            margin-top: 0.2rem;
            margin-bottom: 0.2rem;
        }

        /* Floating Input Search Pill (Signature Dia Bar / Response Panel) */
        .dia-input-pill {
            width: 100%;
            max-width: 100%;
            background: rgba(250, 249, 246, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(227, 216, 204, 0.6);
            border-radius: 32px;
            box-shadow: var(--shadow-float);
            padding: 1.8rem 2.2rem;
            margin-top: 1.5rem;
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: all var(--transition-default);
            animation: subtleGlow 6s infinite ease-in-out alternate;
        }

        @keyframes subtleGlow {
            0% { box-shadow: 0 10px 30px rgba(43, 33, 24, 0.03), 0 2px 8px rgba(43, 33, 24, 0.02); }
            100% { box-shadow: 0 10px 30px rgba(194, 138, 85, 0.06), 0 2px 8px rgba(194, 138, 85, 0.04); }
        }

        .dia-input-pill:focus-within {
            border-color: var(--caramel);
            box-shadow: 0 12px 30px rgba(194, 138, 85, 0.2), 0 0 25px rgba(194, 138, 85, 0.35);
            animation: focusGlow 2.5s infinite ease-in-out;
        }

        @keyframes focusGlow {
            0% { box-shadow: 0 12px 30px rgba(194, 138, 85, 0.15), 0 0 12px rgba(194, 138, 85, 0.15); border-color: var(--caramel); }
            50% { box-shadow: 0 12px 35px rgba(194, 138, 85, 0.25), 0 0 30px rgba(212, 165, 116, 0.5); border-color: var(--soft-gold); }
            100% { box-shadow: 0 12px 30px rgba(194, 138, 85, 0.15), 0 0 12px rgba(194, 138, 85, 0.15); border-color: var(--caramel); }
        }

        .dia-input-row {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
        }

        .dia-search-icon {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        .answer-textarea {
            width: 100%;
            min-height: 250px;
            border: none;
            outline: none;
            font-family: var(--font-sans);
            font-size: 1.05rem;
            color: var(--espresso);
            background: transparent;
            resize: vertical;
            line-height: 1.6;
        }

        .answer-textarea::placeholder {
            color: var(--text-muted);
        }

        .dia-input-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
        }

        .dia-add-tabs {
            font-size: 0.82rem;
            color: var(--coffee);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-inner);
            transition: all var(--transition-default);
        }

        .dia-add-tabs:hover {
            color: var(--espresso);
            background: var(--latte);
        }

        .dia-send-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--espresso);
            color: var(--cream);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-default);
            box-shadow: 0 2px 5px rgba(43, 33, 24, 0.15);
        }

        .dia-send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background: var(--coffee);
            box-shadow: 0 4px 10px rgba(43, 33, 24, 0.25);
        }

        .dia-send-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Evaluation UI inside Dia frame */
        .eval-loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            text-align: center;
            gap: 1.2rem;
        }

        .ai-orb-glow {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--caramel), var(--espresso));
            box-shadow: 0 0 20px rgba(194, 138, 85, 0.25);
            animation: pulse-orb 2s infinite ease-in-out;
        }

        @keyframes pulse-orb {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .eval-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--espresso);
        }

        .eval-steps {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            text-align: left;
            margin-top: 0.6rem;
        }

        .eval-step {
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .eval-step.done::before {
            content: '✓';
            color: var(--coffee);
            font-weight: bold;
        }
        .eval-step.active::before {
            content: '●';
            color: var(--caramel);
        }
        .eval-step.pending::before {
            content: '○';
            color: var(--text-muted);
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(43, 33, 24, 0.4);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all var(--transition-default);
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal-card {
            background: var(--cream);
            padding: 2.2rem;
            border-radius: var(--radius-box);
            box-shadow: var(--shadow-float);
            max-width: 420px;
            width: 90%;
            text-align: center;
            border: 1px solid var(--border);
        }

        .modal-btn {
            border: none;
            padding: 0.75rem 1.6rem;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: all var(--transition-default);
        }
        .modal-btn-secondary {
            background: var(--latte);
            color: var(--espresso);
            border: 1px solid var(--border);
        }
        .modal-btn-secondary:hover {
            background: var(--border);
        }
        .modal-btn-primary {
            background: var(--espresso);
            color: var(--cream);
            box-shadow: 0 4px 12px rgba(43, 33, 24, 0.15);
        }
        .modal-btn-primary:hover {
            background: var(--coffee);
            box-shadow: 0 6px 16px rgba(43, 33, 24, 0.25);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dia-hero-title {
                font-size: 2rem;
                margin-bottom: 1.2rem;
            }
            .dia-window-mockup {
                padding: 1.5rem;
            }
            .q-text {
                font-size: 1.3rem;
            }
            .dia-header {
                padding: 1rem;
            }
            .answer-textarea {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Glowing Gradient Effects -->
    <div class="ambient-glow-top"></div>
    <div class="ambient-glow-bottom-left"></div>
    <div class="ambient-glow-bottom-right"></div>

    <!-- Top Header Navigation Bar: Back on the left, End Interview on the right -->
    <header class="dia-header">
        <a href="dashboard.html" class="dia-widget-btn">
            Back
        </a>
        <button class="dia-widget-btn" onclick="showEndModal()">
            End Interview
        </button>
    </header>

    <!-- Main Workspace -->
    <main class="dia-main">
        
        <!-- Hero Title -->
        <h1 class="dia-hero-title">Chat with your interviewer</h1>
        
        <!-- Subtitle Context Line -->
        <div style="font-size: 0.95rem; font-weight: 500; color: var(--text-secondary); margin-top: 0.2rem; margin-bottom: 1.8rem; text-align: center;">
            <span id="header-role-display">Backend Developer</span> &bull; Adaptive AI Interview
        </div>

        <!-- Viewport Container for Window Mockup & Input Pill -->
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;" id="workspace-viewport">
            <!-- Rendered Dynamically -->
        </div>

    </main>

    <!-- End Interview Modal -->
    <div class="modal-overlay" id="end-modal">
        <div class="modal-card">
            <h3 style="font-size: 1.25rem; font-weight: 700; color: var(--espresso); margin-bottom: 0.5rem;">End Interview?</h3>
            <p style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 1.5rem;">Your current progress will be saved, and evaluation feedback generated.</p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button onclick="hideEndModal()" class="modal-btn modal-btn-secondary">Continue</button>
                <button onclick="confirmEndInterview()" class="modal-btn modal-btn-primary">End Interview</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? "http://localhost:5000" : "";
        let currentState = {
            candidate: { name: "Candidate", role: "Backend Developer" },
            candidateId: "CAND-001",
            sessionId: "INT-" + Date.now(),
            totalQuestions: 10,
            questionNumber: 1,
            status: "ACTIVE", // ACTIVE, EVALUATING, COMPLETED
            currentQuestion: null
        };

        // --- Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            startInterviewDirectly();
        });

        async function startInterviewDirectly() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role') || "Backend Developer";
            
            currentState.candidate.role = role;
            currentState.questionNumber = 1;
            currentState.status = 'ACTIVE';

            const roleDisplay = document.getElementById('header-role-display');
            if (roleDisplay) roleDisplay.textContent = role;

            const viewport = document.getElementById('workspace-viewport');
            viewport.innerHTML = `<div style="text-align:center; margin-top: 5rem;">
                <h2 style="font-size: 1.35rem; color: var(--espresso);">Connecting to AI Interviewer...</h2>
                <p style="color: var(--text-secondary); margin-top: 0.8rem;">Analyzing your candidate profile...</p>
            </div>`;

            try {
                const selectedCandId = urlParams.get('candidateId') || localStorage.getItem('selectedCandidateId') || 'CAND-001';
                currentState.candidateId = selectedCandId;
                // Fetch candidate profile dynamically
                const candRes = await fetch(`${API_BASE_URL}/api/candidates/${selectedCandId}`);
                const candidateProfile = await candRes.json();

                const res = await fetch(`${API_BASE_URL}/api/interview`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        sessionId: currentState.sessionId,
                        candidate: candidateProfile
                    })
                });
                
                const data = await res.json();
                
                currentState.currentQuestion = {
                    topic: "Adaptive Interview",
                    difficulty: "Adaptive",
                    text: data.reply
                };
                
                renderQuestionScreen();
            } catch (err) {
                console.error(err);
                viewport.innerHTML = `<h2 style="text-align:center; margin-top: 5rem; color: #EF4444;">Failed to connect to backend API. Is the server running?</h2>`;
            }
        }

        // Render question screen structure
        window.renderQuestionScreen = function() {
            currentState.status = 'ACTIVE';

            const viewport = document.getElementById('workspace-viewport');
            const q = currentState.currentQuestion;
            const qNumStr = String(currentState.questionNumber).padStart(2, '0');
            const tNumStr = String(currentState.totalQuestions).padStart(2, '0');
            
            viewport.innerHTML = `
                <!-- Background Mockup Window -->
                <div class="dia-window-mockup">
                    <div class="dia-window-dots">
                        <div class="dia-dot"></div>
                        <div class="dia-dot"></div>
                        <div class="dia-dot"></div>
                    </div>
                    
                    <div class="q-meta-row">
                        <span>QUESTION ${qNumStr} / ${tNumStr}</span>
                        <span>•</span>
                        <span>${q.topic}</span>
                        <span>•</span>
                        <span>${q.difficulty}</span>
                    </div>

                    <h2 class="q-text">${q.text}</h2>
                </div>

                <!-- Inline Warning Response Message -->
                <div id="validation-response-block" style="display: none; width: 100%; margin-top: 1.2rem; padding: 1rem 1.2rem; background: var(--cream); border: 1px solid var(--caramel); border-radius: 16px; color: var(--espresso); font-size: 0.9rem; font-weight: 500; line-height: 1.5; animation: msg-rise 0.3s ease;">
                    ⚠️ You have entered something else expecting the correct answer. Please provide a detailed response
                </div>

                <!-- Signature Dia Input Search Pill -->
                <div class="dia-input-pill">
                    <div class="dia-input-row">
                        <span class="dia-search-icon">🔍</span>
                        <textarea class="answer-textarea" id="answer-input" placeholder="Hey Interviewer, here is my response..." oninput="updateCharCount(this)"></textarea>
                    </div>

                    <div class="dia-input-actions">
                        <div class="dia-add-tabs" onclick="alert('Feature: Attachment of code snippet or notes added to response.')">
                            <span>+</span> Add tabs or code files
                        </div>
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <span style="font-size: 0.78rem; color: var(--text-muted);" id="char-count-text">0 / 2500</span>
                            <button class="dia-send-btn" id="btn-submit" onclick="submitAnswer()" title="Submit Answer">
                                ↑
                            </button>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                const input = document.getElementById('answer-input');
                if (input) input.focus();
            }, 50);

            // Shortcut Ctrl+Enter to submit
            setTimeout(() => {
                const ta = document.getElementById('answer-input');
                if (ta) {
                    ta.addEventListener('keydown', (e) => {
                        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                            e.preventDefault();
                            submitAnswer();
                        }
                    });
                }
            }, 100);
        }

        window.updateCharCount = function(el) {
            const countEl = document.getElementById('char-count-text');
            if (countEl) countEl.innerText = `${el.value.length} / 2500`;
        }

        window.submitAnswer = async function() {
            const ta = document.getElementById('answer-input');
            const btn = document.getElementById('btn-submit');
            const warnBlock = document.getElementById('validation-response-block');
            const answerVal = ta ? ta.value.trim() : "";
            
            // Validation for undefined/empty/non-meaningful input
            if (!answerVal || answerVal.length < 10) {
                if (warnBlock) {
                    warnBlock.style.display = 'block';
                    warnBlock.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
                return;
            }

            if (warnBlock) warnBlock.style.display = 'none';
            const answer = answerVal;
            ta.disabled = true;
            if (btn) btn.disabled = true;
            
            renderEvaluationState();

            try {
                const res = await fetch(`${API_BASE_URL}/api/interview`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        sessionId: currentState.sessionId,
                        message: answer
                    })
                });
                
                const data = await res.json();
                
                if (data.reply && data.reply.includes("You have entered something else expecting the correct answer")) {
                    // Re-enable input and show warning block
                    ta.disabled = false;
                    if (btn) btn.disabled = false;
                    renderQuestionScreen();
                    
                    const newWarnBlock = document.getElementById('validation-response-block');
                    if (newWarnBlock) {
                        newWarnBlock.style.display = 'block';
                        newWarnBlock.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                    return;
                }
                
                if (data.done) {
                    renderFinalReport(data.feedback);
                } else {
                    currentState.questionNumber++;
                    currentState.currentQuestion = {
                        topic: "Adaptive Question",
                        difficulty: "Adaptive",
                        text: data.reply
                    };
                    renderQuestionScreen();
                }
            } catch (err) {
                console.error(err);
                alert("Failed to evaluate answer via AI.");
                // Fallback to next question or end
                currentState.questionNumber++;
                renderQuestionScreen();
            }
        }

        window.renderEvaluationState = function() {
            const viewport = document.getElementById('workspace-viewport');
            
            viewport.innerHTML = `
                <div class="dia-window-mockup" style="padding-bottom: 2rem;">
                    <div class="dia-window-dots">
                        <div class="dia-dot"></div>
                        <div class="dia-dot"></div>
                        <div class="dia-dot"></div>
                    </div>

                    <div class="eval-loading-box">
                        <div class="ai-orb-glow"></div>
                        <h2 class="eval-title">Analyzing response with AI interviewer...</h2>
                        
                        <div class="eval-steps">
                            <div class="eval-step done" id="step-1">Evaluating technical accuracy</div>
                            <div class="eval-step active" id="step-2">Checking architectural concepts</div>
                            <div class="eval-step pending" id="step-3">Generating next question</div>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                const s2 = document.getElementById('step-2');
                const s3 = document.getElementById('step-3');
                if (s2) s2.className = 'eval-step done';
                if (s3) s3.className = 'eval-step active';
            }, 1500);
        }

        window.renderFinalReport = function(feedback) {
            currentState.status = 'COMPLETED';

            feedback = feedback || { summary: "Interview completed.", strengths: [], gaps: [], next: [] };
            const strengths = feedback.strengths || [];
            const gaps = feedback.gaps || [];

            // Save interview evaluation report to localStorage for dashboard integration
            const reportData = {
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                role: currentState.candidate.role || "Backend Developer",
                summary: feedback.summary,
                strengths: strengths,
                weaknesses: gaps // Dashboard expects 'weaknesses'
            };

            try {
                localStorage.setItem('latestInterviewReport_' + currentState.candidateId, JSON.stringify(reportData));
            } catch (e) {
                console.error("Failed to save interview report to localStorage", e);
            }

            const viewport = document.getElementById('workspace-viewport');
            viewport.innerHTML = `
                <div class="dia-window-mockup" style="padding-bottom: 2.5rem;">
                    <div class="dia-window-dots">
                        <div class="dia-dot"></div>
                        <div class="dia-dot"></div>
                        <div class="dia-dot"></div>
                    </div>

                    <div style="text-align: center; margin-bottom: 1rem;">
                        <span style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase;">INTERVIEW COMPLETED</span>
                        <div style="font-size: 1.25rem; font-weight: 700; color: var(--espresso); line-height: 1.4; margin-top: 1rem;">Report Generated Successfully</div>
                        <div style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.5rem;">View detailed breakdown on your Dashboard.</div>
                    </div>

                    <div style="background: var(--latte); padding: 1.5rem; border-radius: 16px; border: 1px solid var(--border); font-size: 0.95rem; line-height: 1.6; color: var(--espresso); margin-bottom: 1rem;">
                        <strong>AI Feedback Summary:</strong> ${reportData.summary}
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1rem;">
                        <div style="background: var(--cream); padding: 1.2rem; border-radius: 16px; border: 1px solid var(--border);">
                            <h4 style="font-size: 0.85rem; font-weight: 700; color: var(--coffee); text-transform: uppercase; margin-bottom: 0.8rem;">✓ Strengths</h4>
                            <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.9rem; color: var(--text-secondary); padding-left: 0;">
                                ${strengths.length > 0 ? strengths.map(s => `<li>• ${s}</li>`).join('') : '<li>• No distinct strengths identified</li>'}
                            </ul>
                        </div>
                        
                        <div style="background: var(--cream); padding: 1.2rem; border-radius: 16px; border: 1px solid var(--border);">
                            <h4 style="font-size: 0.85rem; font-weight: 700; color: var(--caramel); text-transform: uppercase; margin-bottom: 0.8rem;">! Areas to Improve</h4>
                            <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.9rem; color: var(--text-secondary); padding-left: 0;">
                                ${gaps.length > 0 ? gaps.map(w => `<li>• ${w}</li>`).join('') : '<li>• No critical gaps identified</li>'}
                            </ul>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: center; gap: 1rem; margin-top: 1rem;">
                        <a href="dashboard.html" class="dia-widget-btn" style="background: var(--latte); color: var(--espresso); border: 1px solid var(--border);">Back to Dashboard</a>
                        <button class="dia-widget-btn" onclick="startInterviewDirectly()">Retry Interview</button>
                    </div>
                </div>
            `;
        }

        // --- Modals ---
        window.showEndModal = function() {
            const modal = document.getElementById('end-modal');
            if (modal) modal.classList.add('active');
        }

        window.hideEndModal = function() {
            const modal = document.getElementById('end-modal');
            if (modal) modal.classList.remove('active');
        }

        window.confirmEndInterview = function() {
            hideEndModal();
            renderFinalReport();
        }
    </script>
</body>
</html>
